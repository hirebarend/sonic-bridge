services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SONIC_DOMAIN=${SONIC_DOMAIN}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${SONIC_ACME_EMAIL}
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./deploy/traefik/acme:/acme

  api:
    build:
      context: ./api
    restart: unless-stopped
    expose:
      - "3000"

  web:
    build:
      context: ./web
    restart: unless-stopped
    expose:
      - "80"
