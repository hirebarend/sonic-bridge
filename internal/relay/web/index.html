<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Live audio bridge: listen to whatever source is publishing." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>sonic-bridge</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        background: #0b0b0f;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        min-height: 100dvh;
        margin: 0;
        padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
        background: #0b0b0f;
        color: #f2f2f5;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      button {
        width: 9rem;
        height: 9rem;
        border: 1px solid #2a2a37;
        border-radius: 50%;
        background: #14141b;
        color: #f2f2f5;
        font: 600 0.9375rem/1 inherit;
        cursor: pointer;
        transition: transform 0.15s, background-color 0.15s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button:active {
        transform: scale(0.96);
      }

      button[data-listening="true"] {
        border-color: transparent;
        background: #34d399;
        color: #0b0b0f;
      }

      p {
        margin: 0;
        min-height: 1.5rem;
        color: #8c8c9e;
      }
    </style>
  </head>
  <body>
    <h1>sonic-bridge</h1>
    <button id="listen" type="button" data-listening="false">Listen</button>
    <p id="status" role="status" aria-live="polite">Idle</p>
    <audio id="sink" playsinline hidden></audio>

    <script type="module">
      import { decodeMulaw, toFloat32 } from "./codec.js";

      // The jitter buffer absorbs network variation before playback starts.
      const RING_MILLISECONDS = 1000;
      const PREFILL_MILLISECONDS = 120;

      // The relay has no source until one connects, so opening the page first
      // is normal rather than an error. Back off and keep trying.
      const RECONNECT_BASE_MILLISECONDS = 500;
      const RECONNECT_MAX_MILLISECONDS = 8000;

      // Both sources send 16 kHz. The graph is built at this rate before the
      // relay has announced anything, and rebuilt only if it disagrees.
      const NOMINAL_SAMPLE_RATE = 16000;

      const button = document.getElementById("listen");
      const status = document.getElementById("status");
      const sink = document.getElementById("sink");

      let context = null;
      let output = null;
      let worklet = null;
      let socket = null;
      let format = null;
      let epoch = null;
      let legacyPosition = 0;
      let messages = Promise.resolve();
      let listening = false;
      let attempt = 0;
      let retry = null;

      function show(text) {
        status.textContent = text;
        button.textContent = listening ? "Stop" : "Listen";
        button.dataset.listening = String(listening);
      }

      // Everything up to play() runs synchronously inside the click handler.
      // Awaiting before it loses the user gesture on iOS, and the result is
      // silence with no error.
      async function openPlayback(sampleRate) {
        const playbackContext = new AudioContext({ sampleRate });
        context = playbackContext;
        output = context.createMediaStreamDestination();
        sink.srcObject = output.stream;
        sink.play().catch(() => undefined);

        await playbackContext.audioWorklet.addModule("./playback-processor.js");
        if (context !== playbackContext) return;
        await playbackContext.resume();
        if (context !== playbackContext) return;

        worklet = new AudioWorkletNode(context, "playback-processor", {
          numberOfInputs: 0,
          numberOfOutputs: 1,
          outputChannelCount: [1],
          processorOptions: {
            ringSamples: Math.round((context.sampleRate * RING_MILLISECONDS) / 1000),
            prefillSamples: Math.round((context.sampleRate * PREFILL_MILLISECONDS) / 1000),
          },
        });

        worklet.connect(output);
      }

      async function closePlayback() {
        worklet?.disconnect();
        worklet = null;
        output = null;

        if (context !== null) {
          const previous = context;
          context = null;
          await previous.close();
        }
      }

      // A jitter buffer cannot resample, so a stream whose rate differs from
      // the graph forces a rebuild. The page already has a gesture by now, so
      // the new context starts running.
      async function applyFormat(payload, connection) {
        let announced = null;

        try {
          announced = JSON.parse(payload);
        } catch {
          throw new Error("The relay sent an unreadable format");
        }

        if (announced === null || typeof announced !== "object") throw new Error("Invalid format");
        if (announced.state === "waiting") {
          format = null;
          worklet?.port.postMessage({ type: "reset" });
          show("Waiting for a source");
          return;
        }
        if (announced.codec !== "mulaw" || announced.channels !== 1 ||
            !Number.isInteger(announced.sampleRate) || announced.sampleRate < 4000 || announced.sampleRate > 48000 ||
            !Number.isInteger(announced.frameSamples) || announced.frameSamples < 1 || announced.frameSamples > 65535 ||
            !Number.isSafeInteger(announced.epoch) || !Number.isSafeInteger(announced.position) || announced.position < 0 ||
            !["quiet", "live"].includes(announced.state) || typeof announced.sparse !== "boolean") {
          throw new Error("The relay sent an unsupported format");
        }
        if (context !== null && context.sampleRate !== announced.sampleRate) {
          await closePlayback();
          if (socket !== connection || !listening) return;
          await openPlayback(announced.sampleRate);
          if (socket !== connection || !listening) return;
        }
        if (epoch !== announced.epoch) {
          worklet?.port.postMessage({ type: "reset" });
          legacyPosition = 0;
        }
        format = announced;
        epoch = announced.epoch;
        attempt = 0;
        if (announced.state === "quiet") {
          worklet?.port.postMessage({ type: "quiet", position: announced.position });
        }
        show(announced.state === "quiet" ? "Quiet" : "Live");
      }

      function playFrame(payload) {
        if (format === null || worklet === null) return;
        let bytes = new Uint8Array(payload);
        let position = legacyPosition;
        if (format.sparse) {
          if (bytes.length < 9) throw new Error("Truncated audio record");
          const view = new DataView(payload);
          position = Number(view.getBigUint64(1, true));
          if (!Number.isSafeInteger(position) || position < 0 || position % format.frameSamples !== 0) {
            throw new Error("Invalid audio position");
          }
          if (bytes[0] === 2 && bytes.length === 9) {
            worklet.port.postMessage({ type: "quiet", position });
            show("Quiet");
            return;
          }
          if (bytes[0] !== 1) throw new Error("Invalid audio record");
          bytes = bytes.subarray(9);
        }
        if (bytes.length !== format.frameSamples) throw new Error("Invalid audio frame size");
        const samples = toFloat32(decodeMulaw(bytes));
        worklet.port.postMessage({ type: "audio", position, samples }, [samples.buffer]);
        legacyPosition = position + bytes.length;
        show("Live");
      }

      function openSocket() {
        if (!listening) {
          return;
        }

        const url = new URL("/listen?v=2", window.location.href);
        url.protocol = url.protocol === "https:" ? "wss:" : "ws:";

        socket = new WebSocket(url);
        socket.binaryType = "arraybuffer";

        const connection = socket;
        socket.onmessage = (event) => {
          // Serialize format changes and audio while an AudioContext rebuild awaits.
          messages = messages.then(async () => {
            if (socket !== connection || !listening) return;
            if (typeof event.data === "string") await applyFormat(event.data, connection);
            else playFrame(event.data);
          }).catch((error) => {
            if (socket === connection) {
              show(error.message);
              worklet?.port.postMessage({ type: "reset" });
              connection.close();
            }
          });
        };

        socket.onclose = () => {
          if (socket !== connection) return;
          socket = null;
          format = null;
          epoch = null;
          worklet?.port.postMessage({ type: "reset" });

          if (!listening) {
            return;
          }

          const delay = Math.min(
            RECONNECT_MAX_MILLISECONDS,
            RECONNECT_BASE_MILLISECONDS * 2 ** attempt,
          );
          attempt += 1;
          show("Waiting for a source");
          retry = window.setTimeout(openSocket, delay);
        };
      }

      function closeSocket() {
        if (socket === null) {
          return;
        }

        socket.onmessage = null;
        socket.onclose = null;
        socket.close();
        socket = null;
      }

      async function start() {
        if (listening) {
          return;
        }

        listening = true;
        attempt = 0;
        show("Starting");

        try {
          await openPlayback(NOMINAL_SAMPLE_RATE);
        } catch {
          listening = false;
          show("This browser cannot open an audio output");

          return;
        }

        openSocket();
      }

      async function stop() {
        listening = false;
        window.clearTimeout(retry);
        retry = null;
        closeSocket();
        await closePlayback();
        format = null;
        epoch = null;
        show("Idle");
      }

      button.addEventListener("click", () => {
        if (listening) {
          stop();

          return;
        }

        start();
      });

      // Puts a title on the lock screen instead of a URL, and lets the
      // operating system's media controls stop playback.
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Live stream",
          artist: "sonic-bridge",
        });
        navigator.mediaSession.setActionHandler("play", start);
        navigator.mediaSession.setActionHandler("pause", stop);
      }
    </script>
  </body>
</html>
