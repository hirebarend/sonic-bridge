; sonic-bridge ESP32-C6 firmware.
;
; The ESP32-C6 requires Arduino-ESP32 3.x, which the stock
; platformio/espressif32 platform does not yet ship (frozen at Arduino 2.0.17
; with ESP-IDF 4.x). We pin the community pioarduino fork which tracks
; Arduino-ESP32 3.x / ESP-IDF 5.x and supports the C6.
;
; Wire format and ports are documented in the root README.

[platformio]
default_envs = esp32-c6-devkitc-1
extra_configs = secrets.ini

[common]
; Non-secret compile-time configuration. Referenced by the env section below
; and by secrets.ini so that both can compose the final build_flags without
; self-recursion.
build_flags =
    -DSONIC_SAMPLE_RATE=16000
    -DSONIC_CHUNK_SAMPLES=1024
    -DSONIC_INMP441_SHIFT=14
    -DSONIC_I2S_BCLK=4
    -DSONIC_I2S_WS=5
    -DSONIC_I2S_SD=6
    -DSONIC_RECONNECT_MS=1000

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}
