; sonic-bridge ESP32-C3 firmware.
;
; Pinned to the community pioarduino fork (Arduino-ESP32 3.x / ESP-IDF 5.x)
; for consistent behavior with newer RISC-V ESP32 chips. Stock
; platformio/espressif32 (Arduino 2.0.17 / IDF 4.x) also supports C3, but the
; I2S APIs differ; this code targets the newer `driver/i2s_std.h`.
;
; All compile-time config (WiFi credentials, server address, pin map, sample
; rate, etc.) lives in src/main.cpp.
;
; Wire format and ports are documented in the root README.

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
