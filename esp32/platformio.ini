; sonic-bridge ESP32-C3 firmware: an audio source.
;
; Pinned to the community pioarduino fork (Arduino-ESP32 3.x / ESP-IDF 5.x) for
; consistent behaviour on newer RISC-V ESP32 chips. Stock
; platformio/espressif32 (Arduino 2.0.17 / IDF 4.x) also supports the C3, but
; its I2S API differs; this firmware targets the newer driver/i2s_std.h.
;
; WiFi credentials and the relay address come from secrets.ini, which is not
; tracked by git. Copy secrets.ini.example and fill it in before flashing.
;
; The wire format is documented in the root README and implemented in
; src/wire.h. Run scripts/check-wire-format.sh to confirm the firmware agrees
; with the Go relay and the browser.

[platformio]
default_envs = esp32-c3-devkitm-1
extra_configs = secrets.ini

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DSONIC_WIFI_SSID='"${secrets.wifi_ssid}"'
    -DSONIC_WIFI_PASS='"${secrets.wifi_password}"'
    -DSONIC_RELAY_HOST='"${secrets.relay_host}"'
    -DSONIC_RELAY_PORT=${secrets.relay_port}
    -DSONIC_SAMPLE_RATE=${secrets.sample_rate}
    -DSONIC_FRAME_SAMPLES=${secrets.frame_samples}

; Optional suppression overrides; uncomment within build_flags above to tune.
;    -DSONIC_SUPPRESSION=0
;    -DSONIC_SENSITIVITY_DB=2.0
;    -DSONIC_SETTLE_SECONDS=30
